# ==================== NOMBRE DE LA APLICACIÓN ====================
spring.application.name=SistemaAeropuerto

# ==================== BASE DE DATOS H2 ====================
# Usamos H2 en memoria (ideal para desarrollo)
spring.datasource.url=jdbc:h2:mem:aeropuertosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola de H2 (para ver las tablas desde el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA / HIBERNATE ====================
# Crear las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==================== SERVIDOR ====================
server.port=8080

# ==================== JSON ====================
# Evitar errores con fechas y referencias circulares
spring.jackson.serialization.fail-on-empty-beans=false